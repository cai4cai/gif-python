[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pygif"
version = "1.0.0"
description = "Python implementation of Geodesic Information Flows (GIF) multi-atlas segmentation"
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Aaron Kujawa", email = "askujawa@gmail.com" }]
keywords = ["medical imaging", "segmentation", "multi-atlas", "GIF", "NiftyReg", "NiftySeg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.10.1",
    "nibabel>=3.2",
    "pandas>=1.3",
    "numba>=0.56",
    "natsort>=7.0",
    "tqdm>=4.60",
    "xmltodict>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff", "pre-commit", "build"]
viz = ["matplotlib", "seaborn"]

[project.urls]
Homepage = "https://github.com/cai4cai/gif-python"
Issues = "https://github.com/cai4cai/gif-python/issues"

[tool.setuptools.packages.find]
# The package layout is flat (`import src...`) and is kept as is.
include = ["src", "src.*"]
