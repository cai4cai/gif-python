[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pygif"
dynamic = ["version"]
description = "Python implementation of Geodesic Information Flows (GIF) multi-atlas segmentation"
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Aaron Kujawa", email = "askujawa@gmail.com" }]
keywords = ["medical imaging", "segmentation", "multi-atlas", "GIF", "NiftyReg", "NiftySeg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.10.1",
    "nibabel>=3.2",
    "pandas>=1.3",
    "numba>=0.56",
    "natsort>=7.0",
    "tqdm>=4.60",
    "xmltodict>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff", "pre-commit", "build"]
viz = ["matplotlib", "seaborn"]

[project.scripts]
gif-python = "src.cli.main:entry_point"

[project.urls]
Homepage = "https://github.com/cai4cai/gif-python"
Issues = "https://github.com/cai4cai/gif-python/issues"

[tool.setuptools.dynamic]
version = { attr = "src.__version__" }

[tool.setuptools.package-data]
"src.resources.mindboggle101" = ["*.csv", "*.txt", "*.sha256", "*.md"]

[tool.setuptools.packages.find]
# The package layout is flat (`import src...`) and is kept as is.
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "gpu: needs the gif_gpu executable (native/) and a CUDA device (skipped automatically otherwise)",
    "integration: needs the NiftyReg and NiftySeg executables (skipped automatically when they are not installed)",
]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["notebooks", "native"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF100"]
ignore = [
    "B905",  # zip() without strict=: needs Python 3.10
    "SIM108", # ternary operator
    "E741",  # ambiguous variable names are common in the numerical code
    # typing.Optional/List/... stay: GifConfig field types are evaluated at run time (typing.get_type_hints),
    # which does not work with `X | None` on Python 3.9
    "UP006",
    "UP007",
    "UP035",
    "UP045",
]

[tool.ruff.lint.per-file-ignores]
# batch scripts and examples run code at import time on purpose
"scripts/**" = ["E402", "E501", "SIM", "B", "C4"]
"examples/**" = ["E402", "E501", "SIM"]
"tests/**" = ["B011", "B017", "E501"]
"tests/regression/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false
